name: Sub2API 今日用量
description: 在 Egern 小组件中显示 Sub2API 今日请求数、Token、消费和平均耗时。
author: ftufkc
homepage: https://github.com/ftufkc/egern-sub2api-usage-widget
manual: https://github.com/ftufkc/egern-sub2api-usage-widget#readme
icon: chart.bar.xaxis

env_schema:
  BASE_URL:
    name: 网站 URL
    description: Sub2API 站点根地址，例如 https://example.com。不要填写 /admin/usage。
  EMAIL:
    name: 登录账号
    description: Sub2API 管理员邮箱。
  PASSWORD:
    name: 登录密码
    description: Sub2API 管理员密码。此值仅保存在你的 Egern 配置中。

scriptings:
  - generic:
      name: sub2api-usage-widget
      script_url: https://raw.githubusercontent.com/ftufkc/egern-sub2api-usage-widget/main/sub2api-usage-widget.js
      timeout: 20

widgets:
  - name: Sub2API 今日用量
    script_name: sub2api-usage-widget
